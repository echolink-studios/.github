name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: ''
        description: "Environment for manual runs (Development, Integration, Production)"

jobs:
  resolve:
    uses: ./.github/workflows/resolve-environment.yml
    with:
      environment: ${{ inputs.environment }}
  
  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.environment }}
          secrets: |
            gh_token=${{ github.token }}

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: [ resolve, build ]
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: true
    environment:
      name: ${{ needs.resolve.outputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_URL }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout docker-compose.yml
        uses: actions/checkout@v7
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Setup Docker Assets
        run: |
          mkdir -p ~/${{ github.repository }}/${{ env.ENVIRONMENT }}
          cp docker-compose.yml ~/${{ github.repository }}/${{ env.ENVIRONMENT }}/docker-compose.yml

      - name: Fetch Flagture configuration
        uses: echolink-studios/.github/.github/actions/flagture-config@main
        with:
          output-file: ~/${{ github.repository }}/${{ env.ENVIRONMENT }}/.env

      - name: Add deployment variables
        run: |
          cd ~/${{ github.repository }}/${{ env.ENVIRONMENT }}
          cat >> .env << EOF
          PROJECT_NAME=${{ github.repository }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}
          APP_URL=${{ vars.DEPLOYMENT_URL }}
          EOF
          
      - name: Pull Image
        run: |
          cd ~/${{ github.repository }}/${{ env.ENVIRONMENT }}
          docker compose -p $(basename "${{ github.repository }}")-${{ env.ENVIRONMENT }} pull

      - name: Run App
        run: |
          cd ~/${{ github.repository }}/${{ env.ENVIRONMENT }}
          docker compose -p $(basename "${{ github.repository }}")-${{ env.ENVIRONMENT }} up -d

      - name: Clean Up
        if: always()
        run: |
          docker image prune -f
