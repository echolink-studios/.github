name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "The target environment (development, integration, production)"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build:
    name: Build New
    runs-on: ubuntu-26.04-arm
    
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
  
      - name: Checkout
        uses: actions/checkout@v7
  
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.environment }}
          secrets: |
            gh_token=${{ github.token }}